name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Miniconda with Python 3.14
      uses: conda-incubator/setup-miniconda@v3
      with:
        python-version: "3.14"
        channels: conda-forge,defaults
        channel-priority: strict
        activate-environment: trading
        environment-file: environment.yml
    
    - name: Install linting dependencies
      shell: bash -el {0}
      run: |
        conda install -c conda-forge ruff mypy -y
        pip install -e . --no-deps
        
    - name: Lint with Ruff
      shell: bash -el {0}
      run: |
        ruff check . --output-format=github
        
    - name: Type check with mypy
      shell: bash -el {0}
      run: |
        mypy app --ignore-missing-imports --no-error-summary || true

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: lint
    services:
      db:
        image: timescale/timescaledb:latest-pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: stocktrader_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Miniconda with Python 3.14
      uses: conda-incubator/setup-miniconda@v3
      with:
        python-version: "3.14"
        channels: conda-forge,defaults
        channel-priority: strict
        activate-environment: trading
        environment-file: environment.yml
    
    - name: Install test dependencies
      shell: bash -el {0}
      run: |
        conda install -c conda-forge pytest pytest-cov pytest-asyncio -y
        pip install -e . --no-deps
        
    - name: Run Tests with Coverage
      shell: bash -el {0}
      env:
        DATABASE_URL: postgresql+asyncpg://postgres:password@localhost:5432/stocktrader_test
        SYNC_DATABASE_URL: postgresql+psycopg2://postgres:password@localhost:5432/stocktrader_test
        REDIS_URL: redis://localhost:6379/0
        ENV_STATE: test
        SECRET_KEY: test_secret_key_for_ci
        API_SECRET_KEY: test_api_key
        ALPACA_API_KEY: test
        ALPACA_SECRET_KEY: test
        ALPACA_TRADING_URL: https://paper-api.alpaca.markets
        FINNHUB_API_KEY: test
        GEMINI_API_KEY: test
      run: |
        pytest tests/ -v --cov=app --cov-report=xml --cov-report=term-missing

    - name: Upload Coverage Report
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.xml
        flags: unittests
        fail_ci_if_error: false

  build:
    name: Build Docker Image
    needs: test
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Build Docker Image
      run: |
        docker build . -t fastapi-stock-trader:${{ github.sha }}
        
    - name: Verify Image
      run: |
        docker images fastapi-stock-trader:${{ github.sha }}

