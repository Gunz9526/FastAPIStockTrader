name: stock-trader
x-app: &app
  image: stock-trader:local
  build:
    context: .
    target: base
  platform: linux/arm64
  env_file: .env
  restart: unless-stopped
  stop_grace_period: 30s
  read_only: true
  tmpfs:
    - /tmp:size=128m
  security_opt:
    - no-new-privileges:true
  cap_drop: [ALL]
  volumes:
    - ./.secrets:/app/.secrets:ro
    - ./data:/app/data
    - ./artifacts:/app/artifacts
    - ./reports:/app/reports
  depends_on:
    db:
      condition: service_healthy
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"

services:
  db:
    image: postgres:17.7-bookworm
    platform: linux/arm64
    restart: unless-stopped
    environment:
      POSTGRES_DB: trader
      POSTGRES_USER: trader
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets: [db_password]
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U trader -d trader"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 2g
    cpus: 0.50
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "3"}
  api:
    <<: *app
    command: [uvicorn, stock_trader.api:app, --host, 0.0.0.0, --port, "8000", --no-access-log]
    ports:
      - "127.0.0.1:8000:8000"
    mem_limit: 512m
    cpus: 0.50
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/live', timeout=3)"]
      interval: 20s
      timeout: 5s
      retries: 3
  engine:
    <<: *app
    command: [stock-trader, engine]
    mem_limit: 3g
    cpus: 1.0
  trainer:
    <<: *app
    command: [stock-trader, trainer]
    mem_limit: 8g
    cpus: 2.0
    stop_grace_period: 30s
  observer:
    <<: *app
    command: [python, -m, stock_trader.observer]
    mem_limit: 512m
    cpus: 0.25
volumes:
  postgres-data:
secrets:
  db_password:
    file: ./.secrets/db_password
