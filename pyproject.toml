[project]
name = "fastapi-stock-trader"
version = "0.1.0"
description = "High-Frequency Stock Trading Platform using FastAPI and TimescaleDB"
authors = [
    { name = "Antigravity Agent", email = "agent@google.com" }
]
requires-python = "==3.14.*"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "sqlalchemy>=2.0.25",
    "alembic>=1.13.1",
    "asyncpg>=0.29.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.1.0",
    "redis>=5.0.1",
    "celery>=5.3.6",
    "python-json-logger>=2.0.7",
    "httpx>=0.26.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "scikit-learn>=1.4.0",
    # ML & Strategy
    "catboost>=1.2.2",
    "lightgbm>=4.3.0",
    "xgboost>=2.0.3",
    "optuna>=3.5.0",
    "joblib>=1.3.2",
    "ta-lib>=0.6.0",
    # Alpaca
    "alpaca-py>=0.43.2",
    # Monitoring
    "prometheus-fastapi-instrumentator>=7.0.0",
    # Data
    "yfinance>=0.2.0",
]

[tool.setuptools]
packages = ["app"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.2.0",
    "mypy>=1.8.0",
    "black>=24.0.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 120
target-version = "py314"
select = ["E", "F", "I", "W", "C90", "B", "UP", "N", "SIM"]
ignore = []

[tool.mypy]
python_version = "3.14"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
log_cli = true
