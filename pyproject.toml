[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "stock-trader"
version = "0.1.0"
description = "Recoverable CPU-only Alpaca paper equity trader"
requires-python = "==3.14.2"
dependencies = [
  "fastapi>=0.135,<1", "uvicorn>=0.34,<1", "pydantic-settings>=2.8,<3",
  "httpx>=0.28,<1", "websockets>=15,<17", "psycopg[binary,pool]>=3.2,<4",
  "numpy>=2.3,<3", "pandas>=2.3,<4", "pyarrow>=20,<30",
  "lightgbm>=4.6,<5", "scikit-learn>=1.7,<2", "xgboost-cpu>=3.4,<4", "catboost>=1.2.10,<2",
]

[project.scripts]
stock-trader = "stock_trader.cli:main"

[dependency-groups]
dev = ["pytest>=8.3,<10", "pytest-asyncio>=0.26,<2", "ruff>=0.11,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/stock_trader"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["stock_trader"]
